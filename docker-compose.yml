services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      DATABASE_URL: postgresql://notes:notes@db:5432/notes
      TZ: ${TZ:-Europe/Moscow}
      OWNER_ID: ${OWNER_ID:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: